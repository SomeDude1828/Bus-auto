name: Update LPP timetable

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # 17:00 UTC = 19:00 in Slovenia during summer time, before evening planning.
    - cron: '0 17 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build timetable data
        run: python scripts/build_data.py
      - name: Commit updated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.json
          git diff --cached --quiet || git commit -m 'Update LPP timetable'
          git push
